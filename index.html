<!DOCTYPE html>

            <path transform="translate(-12)" d="M94 5.5C93 3 90 1.8 87 1.8 83 1.8 80.8 4 80.8 6.4 80.8 12.2 93.2 10.8 93.2 17.4 93.2 20.2 90.5 22.2 87 22.2 83.5 22.2 81 20.5 80.2 17.8"/>

    <nav class="site-nav" aria-label="Main">
      <a href="#work">Work</a>
      <a href="#about">About</a>
    </nav>

  <main>
    <section class="work" id="work" aria-label="Work">
      <div class="work-grid" id="work-grid"></div>
      <noscript><p class="noscript">Turn on JavaScript to see the projects.</p></noscript>
    </section>

    <section class="about" id="about" aria-labelledby="about-title">
      <h2 class="about__title" id="about-title">About</h2>
      <p class="about__text">Designer working with furniture, lighting and everyday objects. This page shows a selection of recent projects.</p>
    </section>
  </main>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer__bar">
      <h3 class="viewer__title" id="viewer-title"></h3>
      <button type="button" class="viewer__close" id="viewer-close">Close</button>
    </div>
    <img class="viewer__image" id="viewer-image" src="assets/images/candle-holders.svg" alt="" width="865" height="435">
    <div class="viewer__nav">
      <button type="button" id="viewer-prev">Previous</button>
      <span class="viewer__count" id="viewer-count"></span>
      <button type="button" id="viewer-next">Next</button>
    </div>
  </dialog>

  <script src="script.js"></script>
